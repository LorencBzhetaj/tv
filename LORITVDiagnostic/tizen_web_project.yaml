# Project type [web_app, test_runner]
project_type: web_app

# Default profile, Tizen API version
profile: tv-samsung
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output name for application
output_name: LORITVDiagnostic

# Output path for build
output_path: ""

# Enable size optimization of wgt for web workspace
opt: false

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# list of certs in web project (.trust-anchor)
trust_anchor: []

# list of files in web project (.html,.css etc) and resources
files:
  - css/style.css
  - icon.png
  - index.html
  - main.js
  - audio-entry.js
  - audio.html
  - audio.js
  - css/audio.css
  - media/audio-test.mp3
  - media/invalid-audio.mp3
  - media/LICENSE.txt
  - video-entry.js
  - video.html
  - video.js
  - css/video.css
  - media/video-test.mp4
  - media/invalid-video.mp4
  - media/video-fixture.json
  - media/hls/playlist.m3u8
  - media/hls/segment-00.ts
  - media/hls/segment-01.ts
  - media/hls/segment-02.ts
  - media/hls/segment-03.ts

# list of files to exclude based on the matched patterns
excludes:
  - .tizen-rds
  - .tizen-rds/*
  - Build/*
  - Debug/*
  - Directory.Build.targets
  - Release/*
  - Test/*
  - \.Build/.*
  - \.buildResult/.*
  - \.csproj
  - \.externalToolBuilders/.*
  - \.gn
  - \.obj/.*
  - \.package/.*
  - \.project
  - \.rds_delta
  - \.sdk_delta.info
  - \.settings/.*
  - \.sign/.*
  - \.tizen-ui-builder-tool.xml
  - \.tproject
  - \.wgt
  - tizen_web_project.yaml
  - webUnitTest/*

# project dependencies
deps: []

