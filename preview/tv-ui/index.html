<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'">
  <title>LORI TV · Interactive design preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="canvas">
    <div id="nav-shade" data-action="menu" hidden></div>
    <aside id="sidebar" aria-label="Main navigation"></aside>
    <header id="header"></header>
    <main id="content" tabindex="-1"></main>
    <footer><span class="preview-dot"></span><span id="disclaimer"></span><span id="key-hint">↑ ↓ ← → · Enter · Esc / Backspace · F · H</span></footer>
    <div id="help" hidden></div>
    <div id="modal-layer" hidden></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script src="fixtures.js"></script>
  <script src="app.js"></script>
</body>
</html>
